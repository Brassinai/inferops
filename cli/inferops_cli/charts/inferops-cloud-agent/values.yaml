image:
  repository: ghcr.io/brassinai/inferops-cloud-agent
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

cloud:
  apiUrl: ""
  providerAccountId: ""
  providerClusterId: ""
  meshProvider: tailscale
  meshHostname: ""
  meshIp: ""
  meshEndpointUrl: ""
  heartbeatIntervalSeconds: 30
  discoveryRequired: true
  benchmark:
    enabled: false
    timeoutSeconds: 10
    maxTokens: 16
    # Safety ceilings for the benchmark probes, not provider-entered capacity.
    # The agent derives actual values from deployment/runtime config and
    # accepted inference requests.
    maxOutputTokens: 256
    maxContextTokens: 32768
    maxConcurrency: 8
    latencySLOMillis: 10000
    totalTimeoutSeconds: 120
  credentialSecretName: inferops-cloud-connection
  gatewayAuthSecretName: inferops-gateway-auth

networkPolicy:
  enabled: true
  egress:
    # Allow DNS and HTTPS by default because cloud API endpoints are external.
    allowDNS: true
    allowHTTPS: true
    allowRuntimeHTTP: true
    runtimePorts:
      - 8000
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  runtime:
    podSelector:
      matchLabels:
        app.kubernetes.io/managed-by: inferops-operator
        app.kubernetes.io/part-of: inferops
        app.kubernetes.io/component: model-runtime

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

probes:
  livenessPath: /healthz
  readinessPath: /readyz

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
