{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inferops-cloud-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-cloud-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "inferops-cloud-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowHTTPS }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
