image:
  repository: ghcr.io/brassinai/inferops-gateway
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

networkPolicy:
  enabled: true
  gateway:
    # Empty permits all sources on the gateway HTTP port. Narrow this to the
    # ingress controller or tailnet peers in production.
    ingressFrom: []
    # Replace these common Kubernetes API Service IPs with the exact /32 or
    # /128 advertised as KUBERNETES_SERVICE_HOST in this cluster.
    apiServerCIDRs:
      - 10.96.0.1/32
      - 10.43.0.1/32
      - 10.0.0.1/32
    # Allows the Tailscale sidecar to reach control/DERP over HTTPS and direct
    # WireGuard peers over UDP without disabling the rest of the policy.
    tailscaleEgress: false
  runtime:
    # Add monitoring peers when Prometheus scrapes runtime metrics directly.
    additionalIngressFrom: []
    # Runtime weights are prepared by separate cache Jobs, so runtime pods
    # need no egress by default. Add explicit rules only when required.
    egress: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns

tenancy:
  access:
    enabled: false
    roleName: inferops-team-operator
    # User and Group subjects preserve individual Kubernetes audit identity.
    # ServiceAccount subjects must include their namespace.
    subjects: []
    allowModelRuntimeWrite: false
    # Keep deletion platform-admin-only because direct Kubernetes deletes
    # bypass the CLI's in-use cache checks.
    allowCacheDelete: false
  quota:
    enabled: false
    hard:
      pods: "20"
      requests.cpu: "16"
      requests.memory: 64Gi
      limits.cpu: "32"
      limits.memory: 128Gi
      count/modeldeployments.inference.inferops.dev: "10"
      count/modelcaches.inference.inferops.dev: "20"
  limitRange:
    enabled: false
    limits:
      - type: Container
        defaultRequest:
          cpu: 100m
          memory: 128Mi
        default:
          cpu: "8"
          memory: 32Gi

discovery:
  # Bounds how long a Kubernetes lifecycle or Service change can remain unseen.
  # The gateway rejects values below one second.
  syncInterval: 5s

trafficPolicy:
  # Defaults apply only when spec.routing.policy does not set an override.
  defaultRateLimit:
    # Zero disables process-local gateway rate limiting.
    requestsPerMinute: 0
    # Zero uses requestsPerMinute as the token bucket burst when rate limiting
    # is enabled.
    burst: 0
  requestLogging:
    # Logs sanitized request metadata only: model, namespace, route, method,
    # path, status, and duration. Bodies and credential headers are never logged.
    enabled: false

auth:
  enabled: false
  # Name of an existing Secret in the release namespace.
  secretName: ""
  # The key contains one bearer token per line.
  secretKey: token
  mountPath: /var/run/secrets/inferops-gateway-auth

podDisruptionBudget:
  enabled: true
  minAvailable: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}
  # Optional settings for cloud or controller-provided LoadBalancer Services.
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Cluster

ingress:
  enabled: false
  # Set this explicitly unless the cluster has a trusted default IngressClass.
  className: ""
  annotations: {}
  hostname: ""
  path: /
  pathType: Prefix
  tls: []

gatewayAPI:
  enabled: false
  annotations: {}
  # References an operator-managed Gateway. The chart creates only HTTPRoute.
  parentRefs: []
  hostnames: []
  path: /

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

tailscale:
  enabled: false
  # operator creates a Tailscale Ingress through the Kubernetes operator.
  # headscale runs a local-dev Tailscale sidecar in the gateway Pod.
  # managed-sidecar runs a Tailscale sidecar with an InferCloud-issued auth key.
  mode: operator
  hostname: inferops
  annotations: {}
  loginServer: ""
  authKeySecretName: ""
  authKeySecretKey: meshAuthKey
  image:
    repository: tailscale/tailscale
    tag: v1.80.3
    pullPolicy: IfNotPresent
  stateDir: /var/lib/tailscale
  kubeSecret: ""
  userspace: false
  authOnce: true
  # Empty targets the gateway container through the Pod IP. Use 127.0.0.1 only
  # in environments where loopback DNAT is explicitly enabled.
  destIP: ""
  extraArgs: "--accept-dns=false"

probes:
  livenessPath: /healthz
  readinessPath: /readyz

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
# Generates a release-specific selector so separate gateway releases do not
# affect one another's topology skew.
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
# Advanced additional constraints. Do not combine with topologySpread.enabled.
topologySpreadConstraints: []
