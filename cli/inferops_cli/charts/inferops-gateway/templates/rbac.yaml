{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "inferops-gateway.fullname" . }}-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - inference.inferops.dev
    resources:
      - modeldeployments
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
  {{- if and .Values.tailscale.enabled (or (eq .Values.tailscale.mode "headscale") (eq .Values.tailscale.mode "managed-sidecar")) .Values.tailscale.kubeSecret }}
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.tailscale.kubeSecret | quote }}
    verbs:
      - get
      - update
      - patch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "inferops-gateway.fullname" . }}-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "inferops-gateway.fullname" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "inferops-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
