apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inferops-gateway.fullname" . }}
  labels:
    {{- include "inferops-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "inferops-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferops-gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inferops-gateway.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFEROPS_GATEWAY_REGISTRY
              value: kubernetes
            - name: INFEROPS_GATEWAY_SYNC_INTERVAL
              value: {{ .Values.discovery.syncInterval | quote }}
            - name: INFEROPS_GATEWAY_RATE_LIMIT_RPM
              value: {{ .Values.trafficPolicy.defaultRateLimit.requestsPerMinute | quote }}
            - name: INFEROPS_GATEWAY_RATE_LIMIT_BURST
              value: {{ .Values.trafficPolicy.defaultRateLimit.burst | quote }}
            - name: INFEROPS_GATEWAY_REQUEST_LOGGING
              value: {{ .Values.trafficPolicy.requestLogging.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: INFEROPS_GATEWAY_AUTH_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.auth.mountPath .Values.auth.secretKey | quote }}
            {{- end }}
          {{- if .Values.auth.enabled }}
          volumeMounts:
            - name: gateway-auth
              mountPath: {{ .Values.auth.mountPath | quote }}
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if and .Values.tailscale.enabled (or (eq .Values.tailscale.mode "headscale") (eq .Values.tailscale.mode "managed-sidecar")) }}
        - name: tailscale
          image: "{{ .Values.tailscale.image.repository }}:{{ .Values.tailscale.image.tag }}"
          imagePullPolicy: {{ .Values.tailscale.image.pullPolicy }}
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "tailscale.authKeySecretName is required when tailscale sidecar mode is enabled" .Values.tailscale.authKeySecretName | quote }}
                  key: {{ required "tailscale.authKeySecretKey is required when tailscale sidecar mode is enabled" .Values.tailscale.authKeySecretKey | quote }}
            - name: TS_HOSTNAME
              value: {{ .Values.tailscale.hostname | quote }}
            - name: TS_STATE_DIR
              value: {{ .Values.tailscale.stateDir | quote }}
            - name: TS_KUBE_SECRET
              value: {{ .Values.tailscale.kubeSecret | quote }}
            - name: TS_USERSPACE
              value: {{ .Values.tailscale.userspace | quote }}
            - name: TS_AUTH_ONCE
              value: {{ .Values.tailscale.authOnce | quote }}
            {{- if not .Values.tailscale.userspace }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TS_DEST_IP
              value: {{ default "$(POD_IP)" .Values.tailscale.destIP | quote }}
            {{- end }}
            - name: TS_EXTRA_ARGS
              {{- if eq .Values.tailscale.mode "headscale" }}
              value: {{ printf "--login-server=%s %s" (required "tailscale.loginServer is required when tailscale.mode=headscale" .Values.tailscale.loginServer) .Values.tailscale.extraArgs | quote }}
              {{- else }}
              value: {{ .Values.tailscale.extraArgs | quote }}
              {{- end }}
          volumeMounts:
            - name: tailscale-state
              mountPath: {{ .Values.tailscale.stateDir | quote }}
            {{- if not .Values.tailscale.userspace }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- end }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: {{ ternary false true .Values.tailscale.userspace }}
            readOnlyRootFilesystem: false
            capabilities:
              {{- if .Values.tailscale.userspace }}
              drop:
                - ALL
              {{- else }}
              add:
                - NET_ADMIN
                - SYS_MODULE
              {{- end }}
        {{- end }}
      {{- if or .Values.auth.enabled (and .Values.tailscale.enabled (or (eq .Values.tailscale.mode "headscale") (eq .Values.tailscale.mode "managed-sidecar"))) }}
      volumes:
        {{- if .Values.auth.enabled }}
        - name: gateway-auth
          secret:
            secretName: {{ required "auth.secretName is required when auth.enabled is true" .Values.auth.secretName | quote }}
            defaultMode: 0444
            items:
              - key: {{ required "auth.secretKey is required when auth.enabled is true" .Values.auth.secretKey | quote }}
                path: {{ .Values.auth.secretKey | quote }}
        {{- end }}
        {{- if and .Values.tailscale.enabled (or (eq .Values.tailscale.mode "headscale") (eq .Values.tailscale.mode "managed-sidecar")) }}
        - name: tailscale-state
          emptyDir: {}
        {{- if not .Values.tailscale.userspace }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpread.enabled .Values.topologySpreadConstraints }}
      {{- fail "topologySpread.enabled and topologySpreadConstraints cannot both be configured" }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      {{- if lt (int .Values.topologySpread.maxSkew) 1 }}
      {{- fail "topologySpread.maxSkew must be greater than zero" }}
      {{- end }}
      {{- if not .Values.topologySpread.topologyKey }}
      {{- fail "topologySpread.topologyKey is required when topology spread is enabled" }}
      {{- end }}
      {{- if not (has .Values.topologySpread.whenUnsatisfiable (list "DoNotSchedule" "ScheduleAnyway")) }}
      {{- fail "topologySpread.whenUnsatisfiable must be DoNotSchedule or ScheduleAnyway" }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "inferops-gateway.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
