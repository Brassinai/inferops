apiVersion: v1
kind: Service
metadata:
  name: {{ include "inferops-cloud-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-cloud-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "inferops-cloud-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
