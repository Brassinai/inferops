{{- $cloudAPIURL := required "cloud.apiUrl is required" .Values.cloud.apiUrl }}
{{- $providerAccountID := required "cloud.providerAccountId is required" .Values.cloud.providerAccountId }}
{{- $providerClusterID := required "cloud.providerClusterId is required" .Values.cloud.providerClusterId }}
{{- $meshProvider := required "cloud.meshProvider is required" .Values.cloud.meshProvider }}
{{- $meshHostname := required "cloud.meshHostname is required" .Values.cloud.meshHostname }}
{{- $meshEndpointURL := required "cloud.meshEndpointUrl is required" .Values.cloud.meshEndpointUrl }}
{{- $credentialSecretName := required "cloud.credentialSecretName is required" .Values.cloud.credentialSecretName }}
{{- $gatewayAuthSecretName := required "cloud.gatewayAuthSecretName is required" .Values.cloud.gatewayAuthSecretName }}
{{- $benchmarkTimeoutSeconds := int (dig "benchmark" "timeoutSeconds" 10 .Values.cloud) }}
{{- $benchmarkMaxTokens := int (dig "benchmark" "maxTokens" 16 .Values.cloud) }}
{{- $benchmarkMaxOutputTokens := int (dig "benchmark" "maxOutputTokens" 256 .Values.cloud) }}
{{- $benchmarkMaxContextTokens := int (dig "benchmark" "maxContextTokens" 32768 .Values.cloud) }}
{{- $benchmarkMaxConcurrency := int (dig "benchmark" "maxConcurrency" 8 .Values.cloud) }}
{{- $benchmarkLatencySLOMillis := int (dig "benchmark" "latencySLOMillis" 10000 .Values.cloud) }}
{{- $benchmarkTotalTimeoutSeconds := int (dig "benchmark" "totalTimeoutSeconds" 120 .Values.cloud) }}
{{- if lt (int .Values.cloud.heartbeatIntervalSeconds) 5 }}
{{- fail "cloud.heartbeatIntervalSeconds must be at least 5" }}
{{- end }}
{{- if or (lt $benchmarkTimeoutSeconds 1) (gt $benchmarkTimeoutSeconds 60) }}
{{- fail "cloud.benchmark.timeoutSeconds must be between 1 and 60" }}
{{- end }}
{{- if or (lt $benchmarkMaxTokens 1) (gt $benchmarkMaxTokens 128) }}
{{- fail "cloud.benchmark.maxTokens must be between 1 and 128" }}
{{- end }}
{{- if or (lt $benchmarkMaxOutputTokens 1) (gt $benchmarkMaxOutputTokens 4096) }}
{{- fail "cloud.benchmark.maxOutputTokens must be between 1 and 4096" }}
{{- end }}
{{- if or (lt $benchmarkMaxContextTokens 1024) (gt $benchmarkMaxContextTokens 262144) }}
{{- fail "cloud.benchmark.maxContextTokens must be between 1024 and 262144" }}
{{- end }}
{{- if or (lt $benchmarkMaxConcurrency 1) (gt $benchmarkMaxConcurrency 64) }}
{{- fail "cloud.benchmark.maxConcurrency must be between 1 and 64" }}
{{- end }}
{{- if or (lt $benchmarkLatencySLOMillis 100) (gt $benchmarkLatencySLOMillis 60000) }}
{{- fail "cloud.benchmark.latencySLOMillis must be between 100 and 60000" }}
{{- end }}
{{- if or (lt $benchmarkTotalTimeoutSeconds 5) (gt $benchmarkTotalTimeoutSeconds 600) }}
{{- fail "cloud.benchmark.totalTimeoutSeconds must be between 5 and 600" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inferops-cloud-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inferops-cloud-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      {{- include "inferops-cloud-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferops-cloud-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inferops-cloud-agent.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloud-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFEROPS_CLOUD_API_URL
              value: {{ $cloudAPIURL | quote }}
            - name: INFEROPS_PROVIDER_ACCOUNT_ID
              value: {{ $providerAccountID | quote }}
            - name: INFEROPS_PROVIDER_CLUSTER_ID
              value: {{ $providerClusterID | quote }}
            - name: INFEROPS_MESH_PROVIDER
              value: {{ $meshProvider | quote }}
            - name: INFEROPS_MESH_HOSTNAME
              value: {{ $meshHostname | quote }}
            - name: INFEROPS_MESH_IP
              value: {{ .Values.cloud.meshIp | quote }}
            - name: INFEROPS_MESH_ENDPOINT_URL
              value: {{ $meshEndpointURL | quote }}
            - name: INFEROPS_CLOUD_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.cloud.heartbeatIntervalSeconds | quote }}
            - name: INFEROPS_CLOUD_DISCOVERY_REQUIRED
              value: {{ .Values.cloud.discoveryRequired | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_ENABLED
              value: {{ dig "benchmark" "enabled" false .Values.cloud | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_TIMEOUT_SECONDS
              value: {{ $benchmarkTimeoutSeconds | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_MAX_TOKENS
              value: {{ $benchmarkMaxTokens | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_MAX_OUTPUT_TOKENS
              value: {{ $benchmarkMaxOutputTokens | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_MAX_CONTEXT_TOKENS
              value: {{ $benchmarkMaxContextTokens | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_MAX_CONCURRENCY
              value: {{ $benchmarkMaxConcurrency | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_LATENCY_SLO_MILLIS
              value: {{ $benchmarkLatencySLOMillis | quote }}
            - name: INFEROPS_CLOUD_BENCHMARK_TOTAL_TIMEOUT_SECONDS
              value: {{ $benchmarkTotalTimeoutSeconds | quote }}
            - name: INFEROPS_CLOUD_AGENT_CREDENTIAL_FILE
              value: /var/run/secrets/inferops-cloud/agentCredential
            - name: INFEROPS_GATEWAY_AUTH_TOKEN_FILE
              value: /var/run/secrets/inferops-gateway-auth/token
          volumeMounts:
            - name: cloud-connection
              mountPath: /var/run/secrets/inferops-cloud
              readOnly: true
            - name: gateway-auth
              mountPath: /var/run/secrets/inferops-gateway-auth
              readOnly: true
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: cloud-connection
          secret:
            secretName: {{ $credentialSecretName | quote }}
            defaultMode: 0444
            items:
              - key: agentCredential
                path: agentCredential
        - name: gateway-auth
          secret:
            secretName: {{ $gatewayAuthSecretName | quote }}
            defaultMode: 0444
            items:
              - key: token
                path: token
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
